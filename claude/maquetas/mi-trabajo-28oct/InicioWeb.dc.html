<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Inicio en escritorio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F5F6F7;font-family:Inter,system-ui,sans-serif;color:#111315}
*{box-sizing:border-box}
.app{display:flex;flex-wrap:wrap;min-height:860px}
.side{flex:0 0 220px;background:#fff;border-right:1px solid #E3E6EA;padding:22px 14px;display:flex;flex-direction:column;gap:4px}
.logo{font-weight:700;font-size:18px;padding:0 10px 18px}.logo span{color:#5B636E;font-weight:500}
.nav{padding:10px 12px;border-radius:12px;font-size:14px;color:#5B636E;font-weight:500;text-decoration:none;display:flex;justify-content:space-between;align-items:center}
.nav.on{background:#E8EEFF;color:#1F45C4;font-weight:600}
.nav em{font-style:normal;background:#C0271B;color:#fff;border-radius:999px;font-size:11px;padding:1px 7px}
.main{flex:999 1 700px;min-width:0;padding:26px 34px;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:28px}.sub{font-size:14px;color:#5B636E;margin-top:4px}
.g{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:18px;align-items:start}
.lbl{font-size:12px;font-weight:700;color:#5B636E;margin-bottom:8px}
.card{background:#fff;border:2px solid #2B5CFF;border-radius:18px;overflow:hidden}
.it{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid #F5F6F7;background:#fff;border-left:0;border-right:0;border-bottom:0;width:100%;font-family:inherit;text-align:left}
.it:first-child{border-top:0}
.ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.tt{font-size:14px;font-weight:600}.m{font-size:12px;color:#5B636E}
.n{font-size:20px;font-weight:700}
.all{display:block;margin:10px 14px 14px;border:0;border-radius:14px;background:#2B5CFF;color:#fff;padding:13px;font-size:15px;font-weight:700;font-family:inherit;width:calc(100% - 28px)}
.mods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mo{background:#fff;border:1px solid #E3E6EA;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:4px;font-family:inherit;text-align:left}
.mo b{font-size:16px}.mo span{font-size:13px;color:#5B636E}
.mo .k{font-size:22px;font-weight:700;color:#111315;margin-top:6px}
.tag{font-size:11px;font-weight:700;border-radius:999px;padding:3px 8px}
.tag.n{background:#2B5CFF;color:#fff}.tag.o{background:#ECEEF1;color:#5B636E}
</style>
</helmet>
<div class="app">
  <nav class="side" aria-label="Menú">
    <div class="logo">airtek <span>Empresas</span></div>
    <a class="nav on" href="#">Inicio</a><a class="nav" href="#">Mi trabajo <em>9</em></a><a class="nav" href="#">Clientes</a><a class="nav" href="#">Comisiones</a><a class="nav" href="#">Migraciones</a><a class="nav" href="#">Factibilidad</a>
  </nav>
  <main class="main">
    <div><h1>Buenos días, Rosa</h1><div class="sub">Corte de noviembre abierto · día límite 18 de noviembre.</div></div>
    <div class="g">
      <div>
        <div class="lbl">MIS PENDIENTES, AGRUPADOS <span class="tag n">nuevo</span></div>
        <section class="card">
          <button class="it"><span class="ic" style="background:#FCEDEB;color:#A32117">!</span><span><span class="tt">Devueltos</span><br><span class="m">1 en el corte</span></span><span class="n" style="color:#A32117">3</span></button>
          <button class="it"><span class="ic" style="background:#FBF1DC;color:#754B00">$</span><span><span class="tt">Faltan para comisionar</span><br><span class="m">límite 18/11</span></span><span class="n" style="color:#754B00">2</span></button>
          <button class="it"><span class="ic" style="background:#FBF1DC;color:#754B00">24h</span><span><span class="tt">Por instalar</span><br><span class="m">órdenes de más de 24 horas</span></span><span class="n" style="color:#754B00">2</span></button>
          <button class="it"><span class="ic" style="background:#E8EEFF;color:#1F45C4">✓</span><span><span class="tt">Gestiones asignadas</span><br><span class="m">Recientes sin documentos</span></span><span class="n">1</span></button>
          <button class="it"><span class="ic" style="background:#ECEEF1;color:#3B424B">✎</span><span><span class="tt">Mis notas</span><br><span class="m">1 para hoy</span></span><span class="n">1</span></button>
          <button class="all">Ver todo mi trabajo (9)</button>
        </section>
      </div>
      <div>
        <div class="lbl">MÓDULOS <span class="tag o">como hoy</span></div>
        <div class="mods">
          <button class="mo"><b>Clientes</b><span>Expedientes y estatus legal</span><span class="k">412</span></button>
          <button class="mo"><b>Comisiones</b><span>Corte de noviembre</span><span class="k">5 instaladas</span></button>
          <button class="mo"><b>Migraciones</b><span>Cambios de categoría y titular</span><span class="k">1</span></button>
          <button class="mo"><b>Factibilidad</b><span>Consultar cobertura</span><span class="k">Consultar</span></button>
          <button class="mo"><b>Aliados</b><span>Solicitudes de aliados</span><span class="k">0</span></button>
          <button class="mo"><b>Ranking</b><span>Tu puesto en el corte</span><span class="k">1.º</span></button>
        </div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1366,"height":860}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
