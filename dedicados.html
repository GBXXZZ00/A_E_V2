<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Dedicados</title>
<script>
// Dedicados ya no es una pantalla: todo está en Clientes (tarjeta ISP, o la hoja del cliente si el enlace la traía).
(function(){ var u = new URLSearchParams(location.search); var n = new URLSearchParams(); if(Number(u.get('c'))){ n.set('c', u.get('c')); if(u.get('t')) n.set('t', u.get('t')); } else n.set('s', 'isp'); location.replace('clientes.html?' + n.toString()); })();
</script>
</head>

</html>
